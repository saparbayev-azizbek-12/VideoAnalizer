[project]
name = "videoanalizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "fastapi==0.115.0",
    "ffmpeg>=1.4",
    "imageio-ffmpeg==0.5.1",
    "ipykernel>=7.3.0",
    "jinja2==3.1.4",
    "jupyter>=1.1.1",
    "lap>=0.5.13",
    "mediapipe==0.10.14",
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "python-dotenv>=1.0.1",
    "python-multipart==0.0.9",
    "supervision>=0.30.0",
    "tiktoken>=0.13.0",
    "torch>=2.0.0",
    "transformers>=5.14.1",
    "ultralytics==8.3.49",
    "uvicorn[standard]==0.32.0",
    "onnxruntime>=1.17.0",
    "rfdetr",
    "rtmlib",
]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

